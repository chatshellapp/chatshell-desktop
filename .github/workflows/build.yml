# Required GitHub Secrets:
#
#   Build & Release:
#     APPLE_CERTIFICATE            - Base64-encoded .p12 certificate (macOS signing)
#     APPLE_CERTIFICATE_PASSWORD   - .p12 password
#     APPLE_TEAM_ID                - Apple Developer Team ID (also compiled in as
#                                    CHATSHELL_TEAM_ID for the shared keychain group)
#     APPLE_PROVISIONING_PROFILE   - Base64-encoded Developer ID provisioning profile
#                                    for app.chatshell.desktop (iCloud container +
#                                    keychain groups); must be issued for the same
#                                    certificate as APPLE_CERTIFICATE
#     APPLE_API_KEY_CONTENT        - Base64-encoded .p8 API key (notarization)
#     APPLE_API_KEY                - API Key ID
#     APPLE_API_ISSUER             - API Issuer ID
#
#   Cloudflare R2 (dl.chatshell.app):
#     CLOUDFLARE_ACCOUNT_ID        - Cloudflare account ID
#     R2_ACCESS_KEY_ID             - R2 S3-compatible API token
#   Updater (minisign; artifacts signed when present):
#     TAURI_SIGNING_PRIVATE_KEY       - Private key from `pnpm tauri signer generate`
#                                       (stored at ~/.tauri/chatshell-desktop-updater.key).
#                                       Its absence disables updater artifacts, not the release.
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD - Password for that key
#                                       (stored at ~/.tauri/chatshell-desktop-updater.key.password).
#
#   Website version update:
#     WEBSITE_REPO                 - Website GitHub repo (e.g. chatshellapp/chatshell-website)
#     GH_PAT                       - GitHub PAT with repo write access (push version updates)

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type Check & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout chatshell-agent (sibling path dependency)
        uses: actions/checkout@v7
        with:
          repository: chatshellapp/chatshell-agent
          path: .chatshell-agent-sibling
      - name: Link chatshell-agent at the sibling path Cargo expects
        # checkout forbids paths outside $GITHUB_WORKSPACE, but Cargo.toml
        # points at ../../chatshell-agent — bridge with a symlink.
        run: ln -s "$GITHUB_WORKSPACE/.chatshell-agent-sibling" "$GITHUB_WORKSPACE/../chatshell-agent"

      - name: Linux system dependencies
        # types:check compiles the Rust lib (tauri -> gtk/webkit sys crates);
        # a bare ubuntu runner lacks the pkg-config metadata they need.
        uses: ./.github/actions/linux-deps

      - name: Setup
        uses: ./.github/actions/setup

      - name: Type Check & Lint
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check generated TypeScript bindings are up to date
        run: pnpm types:check


  build-windows:
    name: Build Windows
    needs: check
    runs-on: windows-latest
    env:
      # Without the signing key the release still ships; it just carries no
      # updater artifacts.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout chatshell-agent (sibling path dependency)
        uses: actions/checkout@v7
        with:
          repository: chatshellapp/chatshell-agent
          path: .chatshell-agent-sibling
      - name: Link chatshell-agent at the sibling path Cargo expects
        # Junction: no symlink privilege needed on Windows.
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\chatshell-agent" -Target "$env:GITHUB_WORKSPACE\.chatshell-agent-sibling" | Out-Null

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build App
        shell: bash
        run: |
          UPDATER_ARGS=()
          if [[ "$HAS_UPDATER_KEY" == "true" ]]; then
            UPDATER_ARGS=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles msi "${UPDATER_ARGS[@]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatshell-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig

  build-macos:
    name: Build macOS
    needs: check
    runs-on: macos-15
    permissions:
      contents: read
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_CONTENT != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout chatshell-agent (sibling path dependency)
        uses: actions/checkout@v7
        with:
          repository: chatshellapp/chatshell-agent
          path: .chatshell-agent-sibling
      - name: Link chatshell-agent at the sibling path Cargo expects
        run: ln -s "$GITHUB_WORKSPACE/.chatshell-agent-sibling" "$GITHUB_WORKSPACE/../chatshell-agent"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Import Code Signing Certificate
        if: ${{ env.HAS_APPLE_CERTIFICATE == 'true' }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare provisioning profile and entitlements
        # iCloud container and keychain-access-groups entitlements are only
        # honored when an embedded provisioning profile grants them; without
        # this the app reads the iCloud container with EPERM (os error 1).
        # Generated files live under target/ (gitignored).
        if: ${{ env.HAS_APPLE_CERTIFICATE == 'true' }}
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_PROVISIONING_PROFILE" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_PROVISIONING_PROFILE and APPLE_TEAM_ID are required for a signed macOS build (sync needs the iCloud entitlements)"
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/src-tauri/target/macos-signing"
          mkdir -p "$OUT"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 -d > "$OUT/embedded.provisionprofile"
          security cms -D -i "$OUT/embedded.provisionprofile" > "$OUT/profile.plist"
          PROFILE_APP_ID=$(plutil -extract Entitlements.com\\.apple\\.application-identifier raw -o - "$OUT/profile.plist")
          if [ "$PROFILE_APP_ID" != "${APPLE_TEAM_ID}.app.chatshell.desktop" ]; then
            echo "::error::provisioning profile is for '$PROFILE_APP_ID', expected <team>.app.chatshell.desktop"
            exit 1
          fi
          sed "s/__TEAM_ID__/${APPLE_TEAM_ID}/g" \
            "$GITHUB_WORKSPACE/src-tauri/Entitlements-Release.plist.template" \
            > "$OUT/Entitlements.plist"
          plutil -lint "$OUT/Entitlements.plist"
          echo "MACOS_SIGNING_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Build Universal App
        run: |
          UPDATER_ARGS=()
          if [[ "$HAS_UPDATER_KEY" == "true" ]]; then
            UPDATER_ARGS=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          SIGNING_ARGS=()
          if [[ -n "${MACOS_SIGNING_DIR:-}" ]]; then
            SIGNING_ARGS=(--config "{\"bundle\":{\"macOS\":{\"entitlements\":\"${MACOS_SIGNING_DIR}/Entitlements.plist\",\"files\":{\"embedded.provisionprofile\":\"${MACOS_SIGNING_DIR}/embedded.provisionprofile\"}}}}")
          fi
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg "${UPDATER_ARGS[@]}" "${SIGNING_ARGS[@]}"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Compiled in via option_env! (src/sync_keychain.rs) to form the
          # shared <team>.app.chatshell.sync keychain group.
          CHATSHELL_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify signature, entitlements and embedded profile
        if: ${{ env.HAS_APPLE_CERTIFICATE == 'true' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/ChatShell.app
          cmp "$APP/Contents/embedded.provisionprofile" "$MACOS_SIGNING_DIR/embedded.provisionprofile"
          codesign --verify --strict --deep --verbose=2 "$APP"
          codesign -d --entitlements - --xml "$APP" > "$MACOS_SIGNING_DIR/signed-entitlements.plist"
          E="$MACOS_SIGNING_DIR/signed-entitlements.plist"
          test "$(plutil -extract com\\.apple\\.application-identifier raw -o - "$E")" = "${APPLE_TEAM_ID}.app.chatshell.desktop"
          test "$(plutil -extract com\\.apple\\.developer\\.ubiquity-container-identifiers.0 raw -o - "$E")" = "iCloud.app.chatshell"
          test "$(plutil -extract keychain-access-groups.0 raw -o - "$E")" = "${APPLE_TEAM_ID}.app.chatshell.sync"
          echo "Entitlements and embedded profile verified"
      - name: Setup API Key for Notarization
        if: ${{ env.HAS_APPLE_API_KEY == 'true' }}
        run: |
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" | base64 -d > api_key.p8

      - name: Notarize and Staple DMG
        if: ${{ env.HAS_APPLE_API_KEY == 'true' }}
        run: |
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            echo "Notarizing: $dmg"
            xcrun notarytool submit "$dmg" \
              --key api_key.p8 \
              --key-id "${{ secrets.APPLE_API_KEY }}" \
              --issuer "${{ secrets.APPLE_API_ISSUER }}" \
              --wait
            echo "Stapling: $dmg"
            xcrun stapler staple "$dmg"
          done

      - name: Cleanup API Key
        if: always()
        run: rm -f api_key.p8

      - name: Stage artifacts
        # The macOS updater archive (.app.tar.gz + .sig) is produced by the
        # `app` bundle target — `dmg` alone is not updater-enabled. Flatten
        # dmg/ and macos/ outputs into one directory; upload-artifact would
        # otherwise nest them under their least common ancestor.
        run: |
          mkdir -p staging
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg staging/
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            cp src-tauri/target/universal-apple-darwin/release/bundle/macos/ChatShell.app.tar.gz* staging/
            if [ ! -f staging/ChatShell.app.tar.gz ] || [ ! -f staging/ChatShell.app.tar.gz.sig ]; then
              echo "::error::updater artifacts missing; expected ChatShell.app.tar.gz(.sig) from the app bundle target"
              exit 1
            fi
          fi
          ls -la staging

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatshell-macos
          path: staging/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: check
    runs-on: ubuntu-24.04
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout chatshell-agent (sibling path dependency)
        uses: actions/checkout@v7
        with:
          repository: chatshellapp/chatshell-agent
          path: .chatshell-agent-sibling
      - name: Link chatshell-agent at the sibling path Cargo expects
        run: ln -s "$GITHUB_WORKSPACE/.chatshell-agent-sibling" "$GITHUB_WORKSPACE/../chatshell-agent"

      - name: Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build App
        run: |
          UPDATER_ARGS=()
          if [[ "$HAS_UPDATER_KEY" == "true" ]]; then
            UPDATER_ARGS=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage "${UPDATER_ARGS[@]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatshell-linux
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig

  release:
    name: Create Release & Upload to R2
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Assemble updater feed (latest.json)
        # Fan-in: merges the per-platform minisign .sig artifacts into the
        # Tauri updater feed. URLs point at the first-party dl.chatshell.app
        # mirror; the same feed is attached to the GitHub release as fallback.
        if: env.HAS_UPDATER_KEY == 'true'
        run: node scripts/finalize-latest-json.mjs --release-dir release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/chatshell-windows/*.msi
            release/chatshell-windows/*.msi.sig
            release/chatshell-macos/*
            release/chatshell-linux/*.AppImage
            release/chatshell-linux/*.AppImage.sig
            release/latest.json
          generate_release_notes: true

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Upload to Cloudflare R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Uploading artifacts for v${VERSION} to R2..."
          rclone copy release/chatshell-macos/ "r2:${R2_BUCKET}/v${VERSION}/darwin/universal/" --include "*.dmg" --include "*.app.tar.gz*" -v
          rclone copy release/chatshell-windows/ "r2:${R2_BUCKET}/v${VERSION}/windows/x86_64/" --include "*.msi" --include "*.msi.sig" -v
          rclone copy release/chatshell-linux/ "r2:${R2_BUCKET}/v${VERSION}/linux/x86_64/" --include "*.AppImage" --include "*.AppImage.sig" -v
          # Updater feed at the domain root: https://dl.chatshell.app/latest.json
          if [ -f release/latest.json ]; then
            rclone copyto release/latest.json "r2:${R2_BUCKET}/latest.json" -v
          fi
          echo "R2 upload complete."

  update-website:
    name: Update Website Version
    needs: release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.WEBSITE_REPO }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Update version in site data and docs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating download links to v${VERSION}..."

          # The website builds every download URL from this one constant.
          sed -i "s/export const VERSION = '.*'/export const VERSION = '${VERSION}'/" src/data/site.ts
          grep "export const VERSION = '${VERSION}'" src/data/site.ts

          sed -i "s|dl\.chatshell\.app/v[0-9]\+\.[0-9]\+\.[0-9]\+/|dl.chatshell.app/v${VERSION}/|g" src/content/docs/docs/getting-started/index.md
          sed -i "s/ChatShell_[0-9]\+\.[0-9]\+\.[0-9]\+_/ChatShell_${VERSION}_/g" src/content/docs/docs/getting-started/index.md
          grep "dl.chatshell.app" src/content/docs/docs/getting-started/index.md

      - name: Commit and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update download links to v${VERSION}"
          git push
