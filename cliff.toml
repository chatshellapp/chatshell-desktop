# git-cliff drafts the next CHANGELOG.md section from Conventional Commits.
# The output is a starting point: rewrite entries for users, merge related
# ones, and drop anything internal before pasting it into CHANGELOG.md.
#
#   git cliff --unreleased --tag v0.9.2
#
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.breaking %} (breaking){% endif %}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# The HTML comments only order the groups; they are stripped from the output.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^fix\\((ci|build|release)\\)", skip = true },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^(ci|chore|build|docs|style|test|refactor|revert)", skip = true },
]
